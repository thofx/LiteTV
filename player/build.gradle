plugins {
    id 'com.android.library'
}

android {
    namespace = "com.github.tvbox.osc.player"
    compileSdk 35

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // Media3 marks most of its API surface @UnstableApi; the opt-in check would fail the
        // release build for calls the library itself documents as the intended way to use it
        // (custom load-error policies, cache data sources, the OkHttp data source, ...).
        disable 'UnstableApiUsage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.3.0"
    implementation "com.squareup.okhttp3:okhttp:3.12.11"
    // AndroidX Media3, the maintained successor of ExoPlayer. Pinned to 1.8.0 on purpose:
    // - it fixes H.265 MPEG-TS streams getting stuck (androidx/media#2069, broken since 1.4.0),
    //   which hits Chinese IPTV HEVC channels;
    // - it is the last line that still supports minSdk 21 (1.9.0 raised it to 23);
    // - it avoids 1.5.x, where setting the surface after the player is ready rebuffers
    //   (#1973, VideoView.resume() does exactly that), and 1.9.x-1.10.0, whose tunneling mode
    //   can crash on start (#3099).
    // It needs compileSdk 35, hence AGP 8.6+. 1.11+ would need compileSdk 36 and minSdk 23.
    api "androidx.media3:media3-exoplayer:1.8.0"
    api "androidx.media3:media3-exoplayer-hls:1.8.0"
    api "androidx.media3:media3-exoplayer-dash:1.8.0"
    api "androidx.media3:media3-datasource-okhttp:1.8.0"
    api "androidx.media3:media3-database:1.8.0"
}
