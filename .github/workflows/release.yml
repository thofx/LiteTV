# 推送 v* 标签时：签名构建 release APK，生成 update.json，创建草稿 Release。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   RELEASE_KEYSTORE_BASE64    keystore 文件的 base64（base64 -w0 keystore/litetv.keystore）
#   RELEASE_KEYSTORE_PASSWORD  keystore 口令
#   RELEASE_KEY_ALIAS          密钥别名
#   RELEASE_KEY_PASSWORD       密钥口令
#
# 版本号：versionName 取自标签（v1.8.0 → 1.8.0）；versionCode 取主线提交数，单调递增。
# Release 以草稿创建：发布前 App 内「检查更新」读不到它（update.json 走 releases/latest），
# 确认无误后在 GitHub 页面点 Publish 即对用户生效。
#
# 发版：
#   git tag -a v1.8.0 -m "- 影院暗色重设计
#   - 新的遥控交互"          # 标签说明里的 "- " 条目会成为 App 内的更新说明
#   git push origin v1.8.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode 要用完整提交历史；标签说明也要取到

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve version
        run: |
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Restore keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::缺少 secret RELEASE_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/litetv.keystore

      - name: Tests + signed release APKs
        env:
          ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PATH: keystore/litetv.keystore
          ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_APP_VERSION_NAME: ${{ env.VERSION_NAME }}
          ORG_GRADLE_PROJECT_APP_VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew --no-daemon -Pandroid.useAndroidX=true :app:testDebugUnitTest :app:assembleRelease

      # 改成 make-update-json.sh 约定的名字：LiteTV-v<版本>-<abi>.apk
      - name: Rename and verify APKs
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/LiteTV-v$VERSION_NAME-$abi.apk"
          done
          apksigner="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)apksigner"
          for apk in dist/*.apk; do
            "$apksigner" verify --print-certs "$apk" | head -3
          done
          sha256sum dist/*.apk

      - name: Release notes and update.json
        run: |
          git tag -l --format='%(contents)' "$TAG" > dist/notes.md
          scripts/make-update-json.sh "$VERSION_NAME" "$VERSION_CODE" dist "$TAG" dist/notes.md
          cat dist/update.json

      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ env.TAG }}
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --title "LiteTV $TAG" --notes-file dist/notes.md \
            dist/*.apk dist/update.json
