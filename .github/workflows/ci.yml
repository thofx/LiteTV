# 推送到 main / 提交 PR 时：跑单元测试并打 debug 包，APK 作为 artifact 供下载试装。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.2 / Gradle 8.2 需要 JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # gradle.properties 含签名口令不入库，AndroidX 开关从命令行传入
      - name: Unit tests + debug APK
        run: ./gradlew --no-daemon -Pandroid.useAndroidX=true :app:testDebugUnitTest :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: LiteTV-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
